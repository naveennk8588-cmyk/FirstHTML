<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Fetch API Projects</h1>

<button onclick="userList()">Project 1 - User List</button>
<button onclick="postViewer()">Project 2 - Post Viewer</button>
<button onclick="productViewer()">Project 3 - Product Viewer</button>
<button onclick="weatherApp()">Project 4 - Weather App</button>

<br><br>

<input type="text" id="city" placeholder="Enter City Name">

<hr>

<div id="output"></div>

<script>

// ====================
// Project 1
// User List App
// ====================

function userList(){

fetch("https://jsonplaceholder.typicode.com/users")
.then(response=>response.json())
.then(data=>{

let txt="<h2>User List</h2>";

data.forEach(user=>{

txt+="<p>";
txt+="<b>Name :</b> "+user.name+"<br>";
txt+="<b>Email :</b> "+user.email;
txt+="</p><hr>";

});

document.getElementById("output").innerHTML=txt;

});

}

// ====================
// Project 2
// Post Viewer
// ====================

function postViewer(){

fetch("https://jsonplaceholder.typicode.com/posts")
.then(response=>response.json())
.then(data=>{

let txt="<h2>Posts</h2>";

data.slice(0,10).forEach(post=>{

txt+="<h3>"+post.title+"</h3>";
txt+="<p>"+post.body+"</p>";
txt+="<hr>";

});

document.getElementById("output").innerHTML=txt;

});

}

// ====================
// Project 3
// Product Viewer
// ====================

function productViewer(){

fetch("https://fakestoreapi.com/products")
.then(response=>response.json())
.then(data=>{

let txt="<h2>Products</h2>";

data.forEach(product=>{

txt+="<img src='"+product.image+"' width='100'><br>";
txt+="<b>"+product.title+"</b><br>";
txt+="Price : $"+product.price+"<br><hr>";

});

document.getElementById("output").innerHTML=txt;

});

}

// ====================
// Project 4
// Weather App
// ====================
// Get your free API key from:
// https://openweathermap.org/api

function weatherApp(){

let city=document.getElementById("city").value;

let apiKey="YOUR_API_KEY";

let url="https://api.openweathermap.org/data/2.5/weather?q="+city+"&appid="+apiKey+"&units=metric";

fetch(url)
.then(response=>response.json())
.then(data=>{

let txt="<h2>Weather Report</h2>";

txt+="<p><b>City :</b> "+data.name+"</p>";
txt+="<p><b>Temperature :</b> "+data.main.temp+" °C</p>";
txt+="<p><b>Condition :</b> "+data.weather[0].main+"</p>";

document.getElementById("output").innerHTML=txt;

})
.catch(()=>{

document.getElementById("output").innerHTML="<h3>City Not Found</h3>";

});

}

</script>
    
</body>
</html>
