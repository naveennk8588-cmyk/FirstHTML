<!DOCTYPE html>
<html>
<head>
    <title>Blog Post Viewer</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #fafafa; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; }
        .post {
            background: white;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 4px solid #e74c3c;
        }
        .post h3 { margin: 0 0 10px 0; color: #2c3e50; }
        .post p { margin: 0; color: #555; line-height: 1.6; }
        .post .meta { color: #999; font-size: 14px; margin-top: 10px; }
        .loading { text-align: center; color: #666; font-size: 18px; }
        button {
            padding: 10px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📰 Blog Post Viewer</h1>
        <button onclick="loadPosts()">📚 Load Posts</button>
        <div id="postContainer">
            <div class="loading">Click "Load Posts" to view blog posts</div>
        </div>
    </div>

    <script>
        async function loadPosts() {
            const container = document.getElementById('postContainer');
            container.innerHTML = '<div class="loading">⏳ Loading posts...</div>';
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/posts');
                const posts = await response.json();
                
                container.innerHTML = posts.slice(0, 10).map(post => `
                    <div class="post">
                        <h3>📌 ${post.title}</h3>
                        <p>${post.body}</p>
                        <div class="meta">📝 Post #${post.id} · User ${post.userId}</div>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div style="color: red; text-align: center;">❌ Error loading posts. Please try again.</div>';
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
