<!DOCTYPE html>
<html>
<head>
    <title>User Directory</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #1a1a2e; border-bottom: 3px solid #4a90e2; padding-bottom: 10px; }
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            border-left: 4px solid #4a90e2;
        }
        .user-card:hover { transform: translateY(-3px); }
        .user-card h3 { margin: 0 0 10px 0; color: #1a1a2e; }
        .user-card p { margin: 8px 0; color: #555; }
        .user-card .label { font-weight: bold; color: #333; }
        .loading { text-align: center; color: #666; font-size: 18px; }
        button {
            padding: 10px 25px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 User Directory</h1>
        <button onclick="loadUsers()">🔄 Load Users</button>
        <div id="userContainer" class="user-grid">
            <div class="loading">Click "Load Users" to view directory</div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const container = document.getElementById('userContainer');
            container.innerHTML = '<div class="loading">⏳ Loading users...</div>';
            
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                
                container.innerHTML = users.map(user => `
                    <div class="user-card">
                        <h3>👤 ${user.name}</h3>
                        <p><span class="label">📞 Phone:</span> ${user.phone}</p>
                        <p><span class="label">📧 Email:</span> ${user.email}</p>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div style="color: red; text-align: center;">❌ Error loading users. Please try again.</div>';
                console.error('Error:', error);
            }
        }
    </script>
</body>
</html>
