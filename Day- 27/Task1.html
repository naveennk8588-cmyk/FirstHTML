<!DOCTYPE html>
<html>
<head>
    <title>Task 1 - Fetch Users (Console)</title>
</head>
<body>
    <h1>Task 1: Fetch Users & Print in Console</h1>
    <!-- <p>Open the browser console (F12) to see the users.</p> -->
    <button onclick="fetchUsers()">Fetch Users</button>

    <script>
        async function fetchUsers() {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                console.log('✅ Users fetched successfully:');
                console.log(users);
                alert(`✅ ${users.length} users fetched! Check console.`);
            } catch (error) {
                console.error('❌ Error:', error);
                alert('Error fetching users. Check console.');
            }
        }
    </script>
</body>
</html>
